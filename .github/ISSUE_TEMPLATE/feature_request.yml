name: Feature request
description: An idea for the game, the AI, the API or the app.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Rules changes are welcome; say how they would interact with superposition and measurement.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rules / engine
        - AI
        - UI
        - Online play / desktop app
        - API
        - Documentation
