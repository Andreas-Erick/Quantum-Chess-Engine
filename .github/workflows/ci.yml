name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: flake8
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quantum-chess .
      - run: |
          docker run -d -p 8000:8000 --name qc quantum-chess
          for i in $(seq 1 20); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs qc; exit 1
