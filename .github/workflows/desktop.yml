name: Desktop app

# Builds the desktop installers: a setup .exe for Windows and a .dmg for macOS. Runs on version
# tags (v1.2.3), which also attach the installers to a GitHub release, and on demand from the
# Actions tab (the installers are then workflow artifacts, versioned 0.0.0). Pull requests that
# change what goes into the app build it too, as a check: unsigned and never released.
#
# Dependencies come from requirements-desktop.lock, with hashes. Actions are pinned to commits.
#
# Signing is optional: it runs when the repository has these secrets (except on pull requests),
# and is skipped otherwise.
#   Windows: WINDOWS_CERT_PFX (the code-signing certificate as a base64 .pfx),
#            WINDOWS_CERT_PASSWORD
#   macOS:   MACOS_CERT_P12 ("Developer ID Application" certificate as a base64 .p12),
#            MACOS_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (an
#            app-specific password, for notarization)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/**"
      - "api/**"
      - "desktop/**"
      - "engine/**"
      - "ui/**"
      - "requirements*.txt"
      - "requirements*.lock"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

# A new push to a pull request replaces its build in progress; tag and manual builds always finish.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0" >> "$GITHUB_ENV"
          fi
      - name: Signing available?
        id: signing
        shell: bash
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          MACOS_CERT: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          # Pull request builds are only a check: keep the certificates out of them.
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then exit 0; fi
          echo "windows=${WINDOWS_CERT:+yes}" >> "$GITHUB_OUTPUT"
          echo "macos=${MACOS_CERT:+yes}" >> "$GITHUB_OUTPUT"
      - run: npm ci && npm run build
        working-directory: ui
      - run: pip install --require-hashes -r requirements-desktop.lock
      - run: pyinstaller desktop/quantum_chess.spec --noconfirm

      - name: Sign the app (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'yes'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./desktop/sign-windows.ps1 dist\QuantumChess\QuantumChess.exe
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign the installer (Windows)
        if: runner.os == 'Windows' && steps.signing.outputs.windows == 'yes'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./desktop/sign-windows.ps1 (Get-ChildItem installer\*.exe).FullName

      - name: Sign the app (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.macos == 'yes'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          codesign --force --deep --timestamp --options runtime \
            --entitlements desktop/entitlements.plist --sign "$identity" dist/QuantumChess.app
          codesign --verify --deep --strict dist/QuantumChess.app
      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p installer dmg
          cp -R dist/QuantumChess.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on CI machines; retry a few times.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Quantum Chess" -srcfolder dmg -ov -format UDZO \
              "installer/QuantumChess-$VERSION.dmg" && break
            sleep 5
          done
          test -f "installer/QuantumChess-$VERSION.dmg"
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.macos == 'yes'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="installer/QuantumChess-$VERSION.dmg"
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$dmg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ runner.os }}
          path: installer/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            QuantumChess-Setup-*.exe
            QuantumChess-*.dmg
