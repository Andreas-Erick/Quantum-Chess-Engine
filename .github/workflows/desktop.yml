name: Desktop app

# Builds the desktop app for Windows and macOS. Runs on version tags (v1.2.3), which also
# attach the zipped apps to a GitHub release, and on demand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: QuantumChess-windows
          - os: macos-latest
            artifact: QuantumChess-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci && npm run build
        working-directory: ui
      - run: pip install -r requirements-desktop.txt
      - run: pyinstaller desktop/quantum_chess.spec --noconfirm
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent QuantumChess.app ../${{ matrix.artifact }}.zip
          else
            7z a ../${{ matrix.artifact }}.zip QuantumChess
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
