name: Desktop app

# Builds the desktop installers: a setup .exe for Windows and a .dmg for macOS. Runs on version
# tags (v1.2.3), which also attach the installers to a GitHub release, and on demand from the
# Actions tab (the installers are then workflow artifacts, versioned 0.0.0).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0" >> "$GITHUB_ENV"
          fi
      - run: npm ci && npm run build
        working-directory: ui
      - run: pip install -r requirements-desktop.txt
      - run: pyinstaller desktop/quantum_chess.spec --noconfirm

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p installer dmg
          cp -R dist/QuantumChess.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on CI machines; retry a few times.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Quantum Chess" -srcfolder dmg -ov -format UDZO \
              "installer/QuantumChess-$VERSION.dmg" && break
            sleep 5
          done
          test -f "installer/QuantumChess-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: installer/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            QuantumChess-Setup-*.exe
            QuantumChess-*.dmg
