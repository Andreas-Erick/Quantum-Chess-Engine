# The same checks as CI, before each commit: `pre-commit install` once (see CONTRIBUTING.md).
# The hooks use the tools from your environment (requirements-dev.txt and ui/node_modules), so
# they always match the versions CI runs.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: biome
        name: biome (ui)
        entry: npm --prefix ui run lint
        language: system
        files: ^ui/
        pass_filenames: false
