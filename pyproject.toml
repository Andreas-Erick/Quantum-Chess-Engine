[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-chess"
version = "0.8.2"
description = "Chess with superposition, entanglement and measurement, simulated with Cirq."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Erick" }]
# Version ranges; the Docker image and desktop releases install the exact versions in the lock
# files (see CONTRIBUTING.md, *Dependencies*).
dependencies = [
    "cirq-core>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",  # uvicorn needs it for the /ws live feed
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
# Building the desktop app into an executable and installer.
bundle = ["quantum-chess[desktop]", "pyinstaller>=6"]
dev = [
    "pytest>=8",
    "pytest-cov>=7,<8",
    "httpx2>=2.0",  # Starlette's TestClient uses it (starlette/testclient.py)
    # Linters and type checker: a new minor version can add rules, so take them on purpose.
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<2.5",
    "pre-commit>=4",
]

[project.scripts]
quantum-chess-arena = "agent.arena:main"    # AI strength matches
quantum-chess-verify = "api.fairness:main"  # check an online game's dice

[project.gui-scripts]
quantum-chess = "desktop.app:main"  # the desktop app

[project.urls]
Homepage = "https://github.com/Andreas-Erick/Quantum-Chess-Engine"
Changelog = "https://github.com/Andreas-Erick/Quantum-Chess-Engine/blob/main/CHANGELOG.md"
Issues = "https://github.com/Andreas-Erick/Quantum-Chess-Engine/issues"

[tool.setuptools.packages.find]
include = ["engine*", "agent*", "api*", "desktop*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ui", "*.md"]  # docs keep their hand-aligned code examples

[tool.ruff.lint]
# pycodestyle and pyflakes (what flake8 checked), plus likely bugs (B), modern syntax (UP),
# simplifications (SIM, C4, PIE, PERF), sorted imports (I) and stale noqa comments (RUF100).
select = ["E", "W", "F", "B", "UP", "SIM", "C4", "PIE", "PERF", "I", "RUF100"]
ignore = [
    "UP007",  # keep Optional[X] / Union: the codebase uses them consistently
    "UP045",
]

[tool.ruff.lint.isort]
known-first-party = ["engine", "agent", "api", "desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]  # understands models' defaults and validators
files = ["engine", "agent", "api", "desktop", "scripts"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["webview.*", "fontTools.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["engine", "agent", "api", "desktop"]
omit = [
    "desktop/__main__.py",   # starts the GUI
    "desktop/make_icon.py",  # one-off asset generator, checked by regenerating the icons
]

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
